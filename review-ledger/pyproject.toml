[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "futu-trade-review"
version = "0.1.0"
description = "Local read-only trade ledger and review"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
futu = ["futu-api>=10.2"]

[project.scripts]
review = "review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
