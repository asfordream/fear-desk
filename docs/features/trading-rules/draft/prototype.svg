<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080"><rect width="1400" height="1080" fill="#f4f7f6"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#19372f}.small{font-size:16px;fill:#61776e}.title{font-size:28px;font-weight:700}.body{font-size:20px}</style><rect x="0" y="0" width="1400" height="86" rx="12" fill="#fff" stroke="#d4e0da"/><text x="32" y="51" class="title">FearDesk</text><text x="240" y="50" class="body">市场总览     复盘总览     收盘日报     交易规则与观察     版本与需求</text><text x="42" y="140" class="title">交易规则与观察</text><text x="42" y="174" class="small">原型草图 · 全部为示意数据 · 尚未开发</text><rect x="42" y="205" width="1316" height="72" rx="12" fill="#e7f1ed" stroke="#d4e0da"/><text x="65" y="237" class="body">北京时间 14:00 · 现有飞书机器人单独发送规则提醒</text><text x="65" y="261" class="small">规则顺序影响网页与推送展示；不改变计算条件。无触发时也发送规则表。</text><text x="42" y="321" class="title">我的交易规则</text><rect x="1110" y="294" width="246" height="48" rx="12" fill="#d9eae2" stroke="#d4e0da"/><text x="1140" y="326" class="body">＋ 新增规则</text><rect x="42" y="350" width="800" height="175" rx="12" fill="#fff" stroke="#d4e0da"/><text x="65" y="390" class="body">⠿  01   大跌后等待三个交易日</text><text x="65" y="423" class="small">自动筛选  ·  已启用  ·  版本 1</text><text x="65" y="458" class="body">单日收盘跌幅超过 5%；最近一次触发后重新倒数。</text><text x="65" y="498" class="small">编辑     停用     删除</text><rect x="42" y="541" width="800" height="155" rx="12" fill="#fff" stroke="#d4e0da"/><text x="65" y="580" class="body">⠿  02   我的开仓检查项</text><text x="65" y="613" class="small">人工检查  ·  示例占位，等待你补充具体内容</text><text x="65" y="652" class="small">编辑     停用     删除</text><rect x="870" y="350" width="488" height="346" rx="12" fill="#edf3f0" stroke="#d4e0da"/><text x="896" y="390" class="title">拖动排序</text><text x="896" y="432" class="body">按住卡片左侧拖动柄，上下移动。</text><text x="896" y="470" class="body">移到上方 → 更早展示</text><text x="896" y="506" class="body">保存后下次打开保留顺序。</text><text x="896" y="550" class="small">规则支持新增、编辑、停用、删除。</text><text x="896" y="582" class="small">旧版本与历史触发记录保留。</text><text x="896" y="620" class="small">编辑仅对后续交易日生效。</text><text x="896" y="661" class="small">人工检查项不会自动判定通过。</text><text x="42" y="747" class="title">每日观察清单</text><text x="42" y="781" class="small">新增触发  ｜  倒数中  ｜  今日到期  ｜  待处理  ｜  历史记录</text><rect x="42" y="807" width="1316" height="178" rx="12" fill="#fff" stroke="#d4e0da"/><text x="64" y="844" class="small">股票        触发跌幅       触发日         观察日         状态             操作</text><path d="M60 861H1340" stroke="#d4e0da"/><text x="64" y="900" class="body">示例 A        −6.2%          T 日            T+3            剩余 2 个交易日</text><text x="64" y="951" class="body">示例 B        −5.8%          T 日            T+3            已到期 · 待处理     [标记已处理]</text><text x="42" y="1030" class="small">待处理股票每天继续提醒，直到在网页标记已处理；不表示自动开仓。</text><text x="42" y="1058" class="small">这是布局示意，规则名、按钮文字、字段与最终样式仍可调整。</text></svg>